[project]
name = "dawasaathi"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=2.8.0",
    "fastapi>=0.162.5",
    "httpx>=0.28.1",
    "indic-transliteration>=2.3.82",
    "jellyfish>=1.3.0",
    "metaphone>=0.6",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "pydantic>=2.14.3",
    "python-multipart>=0.0.33",
    "rapidfuzz>=3.14.6",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore:codecs.open\\(\\) is deprecated:DeprecationWarning:indic_transliteration",
]
